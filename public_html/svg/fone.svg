<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" viewBox="0 0 800 800" style="width: unset">
    <defs>
        <style>
            .flake {
            fill: none;
            stroke: #1F2833;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
            }
        </style>
    </defs>

    <!-- Снежинка 1 (лево-верх) -->
    <g class="flake" transform="translate(200,200)">
        <circle cx="0" cy="0" r="10"/>
        <!-- 6 лучей -->
        <g id="arm1">
            <line x1="0" y1="0" x2="0" y2="-120"/>
            <line x1="0" y1="-40" x2="-18" y2="-60"/>
            <line x1="0" y1="-40" x2="18" y2="-60"/>
            <line x1="0" y1="-80" x2="-18" y2="-100"/>
            <line x1="0" y1="-80" x2="18" y2="-100"/>
        </g>
        <use href="#arm1" transform="rotate(60)"/>
        <use href="#arm1" transform="rotate(120)"/>
        <use href="#arm1" transform="rotate(180)"/>
        <use href="#arm1" transform="rotate(240)"/>
        <use href="#arm1" transform="rotate(300)"/>
    </g>

    <!-- Снежинка 2 (право-верх, с кружочками) -->
    <g class="flake" transform="translate(600,200)">
        <circle cx="0" cy="0" r="24"/>
        <g id="arm2">
            <line x1="0" y1="0" x2="0" y2="-90"/>
            <circle cx="0" cy="-30" r="10"/>
            <circle cx="0" cy="-60" r="10"/>
            <circle cx="0" cy="-90" r="10"/>
        </g>
        <use href="#arm2" transform="rotate(60)"/>
        <use href="#arm2" transform="rotate(120)"/>
        <use href="#arm2" transform="rotate(180)"/>
        <use href="#arm2" transform="rotate(240)"/>
        <use href="#arm2" transform="rotate(300)"/>
    </g>

    <!-- Снежинка 3 (лево-низ, более ветвистая) -->
    <g class="flake" transform="translate(200,600)">
        <circle cx="0" cy="0" r="22"/>
        <g id="arm3">
            <line x1="0" y1="0" x2="0" y2="-120"/>
            <line x1="0" y1="-40" x2="-20" y2="-60"/>
            <line x1="0" y1="-40" x2="20" y2="-60"/>
            <line x1="0" y1="-70" x2="-20" y2="-90"/>
            <line x1="0" y1="-70" x2="20" y2="-90"/>
            <line x1="0" y1="-100" x2="-15" y2="-115"/>
            <line x1="0" y1="-100" x2="15" y2="-115"/>
        </g>
        <use href="#arm3" transform="rotate(60)"/>
        <use href="#arm3" transform="rotate(120)"/>
        <use href="#arm3" transform="rotate(180)"/>
        <use href="#arm3" transform="rotate(240)"/>
        <use href="#arm3" transform="rotate(300)"/>
    </g>

    <!-- Снежинка 4 (право-низ, со звёздой и кружочками) -->
    <g class="flake" transform="translate(600,600)">
        <!-- внутренняя звезда -->
        <polygon points="
      0,-30 7,-10 25,-10 10,3 15,22
      0,12 -15,22 -10,3 -25,-10 -7,-10"
        />
        <g id="arm4">
            <line x1="0" y1="0" x2="0" y2="-110"/>
            <circle cx="0" cy="-50" r="9"/>
            <circle cx="0" cy="-80" r="9"/>
            <circle cx="0" cy="-110" r="9"/>
            <line x1="0" y1="-70" x2="-20" y2="-90"/>
            <circle cx="-20" cy="-90" r="8"/>
            <line x1="0" y1="-70" x2="20" y2="-90"/>
            <circle cx="20" cy="-90" r="8"/>
        </g>
        <use href="#arm4" transform="rotate(60)"/>
        <use href="#arm4" transform="rotate(120)"/>
        <use href="#arm4" transform="rotate(180)"/>
        <use href="#arm4" transform="rotate(240)"/>
        <use href="#arm4" transform="rotate(300)"/>
    </g>
</svg>